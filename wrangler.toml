name = "guess-the-melody"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*", "/s/*", "/admin/*"]

[[durable_objects.bindings]]
name = "MELODY_ROOM"
class_name = "MelodyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MelodyRoom"]

[[d1_databases]]
binding = "CATALOG"
database_name = "guess-the-melody-catalog"
database_id = "REPLACE_AFTER_CREATE"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "guess-the-melody-audio"

[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
