<style>

            0%, 100% { transform: translateY(0); }

            </p>
<!-- Main CTA -->
<div class="flex flex-col items-center space-y-8 w-full max-w-xs">
<button class="group relative w-full py-6 px-12 bg-primary text-on-primary font-headline-lg text-headline-lg-mobile md:text-headline-lg rounded-xl transition-all duration-300 hover:scale-105 active:scale-95" id="start" type="button" style="animation: glow-pulse 3s infinite ease-in-out;">

<script>
        // Micro-interactions
        const btn = document.getElementById('start');
        if (btn) {
          btn.addEventListener('mousemove', (e) => {
              const rect = btn.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              btn.style.setProperty('--x', `${x}px`);
              btn.style.setProperty('--y', `${y}px`);
          });
        }

        // Simulating rhythmic background color shift
        let hue = 260;
        setInterval(() => {
            hue = (hue + 1) % 360;
            document.querySelector('.mesh-gradient').style.filter = `hue-rotate(${Math.sin(Date.now() / 2000) * 10}deg)`;
        }, 100);
    </script>
