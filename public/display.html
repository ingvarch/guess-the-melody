<style>
        /* The HTML `hidden` attribute must always win over Tailwind display
           utilities (.flex/.grid/etc share equal specificity and the CDN sheet
           loads later, so without this an element with `flex hidden` stays visible). */
        [hidden] { display: none !important; }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 6s linear infinite; }
        /* Reveal slide-in: replays every time #reveal-card loses [hidden]. */
        @keyframes reveal-in {
            0%   { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes reveal-line {
            0%   { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        #reveal-card:not([hidden]) { animation: reveal-in 0.6s cubic-bezier(0.16,1,0.3,1) both; }
        #reveal-card:not([hidden]) .reveal-card__artist { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.15s both; }
        #reveal-card:not([hidden]) .reveal-card__title  { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.30s both; }
        #reveal-card:not([hidden]) .reveal-card__year   { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.45s both; }
        #reveal-card:not([hidden]) #next-btn            { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.65s both; }
        /* Headline cross-fade while the genre slot-machine cycles. */
        #display-genre { transition: opacity 0.12s ease; }
        /* Spin overlay: the card scales in on open; the genre text cross-fades
           as the slot-machine cycles. */
        #spin-card:not([hidden]) .spin-card__box { animation: reveal-in 0.4s cubic-bezier(0.16,1,0.3,1) both; }
        #spin-card-genre { transition: opacity 0.12s ease; }
        /* Host-picked genre: no slot-machine, just a confident pop on the name. */
        #spin-card.spin-card--confirm #spin-card-genre { animation: genre-confirm 0.5s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes genre-confirm { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        /* Visualiser bars idle low; they come alive only while a clip plays. */
        @keyframes bar-rest { 0%,100% { opacity: 0.5; } }
        body:not([data-phase="playing"]) .visualizer-bar { opacity: 0.45; }
        .glow-primary-soft { box-shadow: 0 0 30px rgba(208, 188, 255, 0.4); }
        .glow-secondary-soft { box-shadow: 0 0 20px rgba(76, 215, 246, 0.4); }
        .glass-card {
            background: rgba(10, 10, 12, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(208, 188, 255, 0.15);
        }
        .inner-glow-border {
            border: 1px solid transparent;
            background-image: linear-gradient(rgba(19, 19, 21, 1), rgba(19, 19, 21, 1)), radial-gradient(circle at top left, rgba(208, 188, 255, 0.3), rgba(208, 188, 255, 0.05));
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }
        .glow-track-fill {
            box-shadow: 0 0 15px rgba(76, 215, 246, 0.6);
        }
        .visualizer-bar {
            transition: height 0.1s ease;
        }
        .film-grain::after {
            content: "";
            position: fixed;
            top: -100%;
            left: -100%;
            right: -100%;
            bottom: -100%;
            background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
            opacity: 0.03;
            pointer-events: none;
            z-index: 50;
        }
    </style>

<!-- Scripts for Visualizer & Screen Transitions -->
<script>
        const barsContainer = document.getElementById('visualizer');
        if (barsContainer) {
            // Generate dynamic visualizer bars (keep canvas overlay if present)
            function createBars() {
                const canvas = barsContainer.querySelector('canvas');
                barsContainer.innerHTML = '';
                for (let i = 0; i < 40; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'visualizer-bar w-3 rounded-full';
                    if (i % 5 === 0) {
                        bar.classList.add('bg-secondary', 'glow-track-fill');
                    } else if (i % 3 === 0) {
                        bar.classList.add('bg-primary');
                    } else {
                        bar.classList.add('bg-primary/20');
                    }
                    barsContainer.appendChild(bar);
                }
                if (canvas) barsContainer.appendChild(canvas);
            }

            function animateBars() {
                const playing = document.body.dataset.phase === 'playing';
                const bars = barsContainer.querySelectorAll('.visualizer-bar');
                bars.forEach(bar => {
                    // React only while a clip plays; otherwise settle to a calm baseline.
                    const height = playing ? Math.random() * 240 + 20 : 16;
                    bar.style.height = `${height}px`;
                });
            }

            createBars();
            setInterval(animateBars, 150);
        }
    </script>
