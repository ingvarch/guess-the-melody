<style>
        /* The HTML `hidden` attribute must always win over Tailwind display
           utilities (.flex/.grid/etc share equal specificity and the CDN sheet
           loads later, so without this an element with `flex hidden` stays visible). */
        [hidden] { display: none !important; }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        /* Reveal slide-in: replays every time #reveal-card loses [hidden]. */
        @keyframes reveal-in {
            0%   { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes reveal-line {
            0%   { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        #reveal-card:not([hidden]) { animation: reveal-in 0.6s cubic-bezier(0.16,1,0.3,1) both; }
        #reveal-card:not([hidden]) .reveal-card__artist { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.15s both; }
        #reveal-card:not([hidden]) .reveal-card__title  { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.30s both; }
        #reveal-card:not([hidden]) .reveal-card__year   { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.45s both; }
        #reveal-card:not([hidden]) #next-btn            { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.65s both; }
        /* Headline cross-fade while the genre slot-machine cycles. */
        #display-genre { transition: opacity 0.12s ease; }
        /* Genre drum: a 3D cylinder of genre names in the jukebox window.
           display-ui sets --step, --r and --line for the row count and
           transitions --spin to the picked row; while idle on Auto, --drift
           turns it slowly on top. Two copies of the cylinder: dim rows above
           and below, and a bright "lens" clipped to the center band. */
        @property --spin { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
        @property --drift { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
        .genre-drum--idle { animation: drum-drift 60s linear infinite; }
        @keyframes drum-drift { to { --drift: 360deg; } }
        .genre-drum {
            position: relative;
            height: calc(var(--line, 1.2em) * 5);
            font-size: max(1rem, 11cqi);
            line-height: var(--line, 1.2em);
            overflow: hidden;
            transition-property: --spin;
            transition-timing-function: cubic-bezier(0.25, 0.6, 0.3, 1);
        }
        .genre-drum__stage { position: absolute; inset: 0; perspective: calc(var(--r) * 6); }
        .genre-drum__dim {
            color: rgba(203, 195, 215, 0.4);
            --window: linear-gradient(to bottom,
                transparent 0,
                #000 calc(50% - 2.2em),
                #000 calc(50% - 1.5em),
                transparent calc(50% - 0.5em),
                transparent calc(50% + 0.5em),
                #000 calc(50% + 1.5em),
                #000 calc(50% + 2.2em),
                transparent 100%);
            -webkit-mask-image: var(--window);
            mask-image: var(--window);
        }
        .genre-drum__lens { clip-path: inset(calc(50% - var(--line) / 2) 0); }
        .genre-drum__cylinder {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            transform: translateZ(calc(-1 * var(--r))) rotateX(calc(var(--spin) + var(--drift)));
        }
        .genre-drum__row {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            margin-top: calc(var(--line) / -2);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backface-visibility: hidden;
            transform: rotateX(calc(-1 * var(--i) * var(--step))) translateZ(var(--r));
        }
        .genre-drum--landed .genre-drum__lens { animation: drum-land 0.5s cubic-bezier(0.16,1,0.3,1) both; }
        .genre-drum--landed .genre-drum__lens .genre-drum__row {
            background: linear-gradient(90deg, #d0bcff, #4cd7f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @keyframes drum-land { from { transform: scale(1.08); } to { transform: scale(1); } }
        /* Jukebox: a retro cabinet drawn in SVG with the genre drum in its
           title strip, the genre selector on its display and a lever on the
           side. #jukebox takes the height left under the headline; the
           cabinet fills it and fades out at the bottom of the grille, as if
           cut off by the frame. Overlay boxes use the viewBox (200 x 272)
           in percent. --jb is the cabinet width; the rest scales with it. */
        @property --jb { syntax: '<length>'; inherits: true; initial-value: 0px; }
        .jukebox {
            flex: 1 1 0;
            align-self: stretch;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            container-type: size;
        }
        .jukebox__body {
            /* The notes and the lever reach about a quarter of the width past each side. */
            --jb: max(13rem, min(100cqh * 200 / 272, 100cqw / 1.52));
            position: relative;
            flex: none;
            width: var(--jb);
            aspect-ratio: 200 / 272;
        }
        /* Light the cabinet throws on the wall behind it. */
        .jukebox__body::before {
            content: "";
            position: absolute;
            inset: -10% -24%;
            background:
                radial-gradient(closest-side at 50% 30%, rgba(76, 215, 246, 0.22), transparent),
                radial-gradient(closest-side at 50% 75%, rgba(247, 81, 161, 0.18), transparent);
            pointer-events: none;
        }
        .jukebox__art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            -webkit-mask-image: linear-gradient(to bottom, #000 75%, transparent);
            mask-image: linear-gradient(to bottom, #000 75%, transparent);
        }
        /* Only the label turns: the grooves are rings, and a small repaint
           keeps the glow filters around it cheap. */
        .jukebox__label { transform-box: fill-box; transform-origin: center; animation: jukebox-label 7s linear infinite; }
        @keyframes jukebox-label { to { transform: rotate(360deg); } }
        .jukebox__window {
            position: absolute;
            left: 20%;
            top: 41.176%;
            width: 60%;
            height: 20.588%;
            container-type: inline-size;
            overflow: hidden;
            border-radius: 2px;
            background: linear-gradient(180deg, #030305, #121019 50%, #030305);
            box-shadow: inset 0 0 calc(var(--jb) * 0.06) rgba(0, 0, 0, 0.95);
        }
        .jukebox__window .genre-drum { height: 100%; }
        /* Glass glare. */
        .jukebox__window::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(170deg, rgba(255, 255, 255, 0.1), transparent 40%);
            pointer-events: none;
        }
        /* The selector reads as the cabinet's amber display; its box is taller
           than the drawn display so it stays a 44px tap target. */
        .jukebox__select {
            position: absolute;
            left: 15%;
            width: 70%;
            top: 69.853%;
            height: max(6.618%, 2.75rem);
            translate: 0 -50%;
            padding: 0 1.7em 0 0;
            border: 0;
            border-radius: 0.4rem;
            background-color: transparent;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23ffe27a' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.4em center;
            background-repeat: no-repeat;
            background-size: 1.2em 1.2em;
            color: #ffe27a;
            font-size: max(11px, var(--jb) * 0.05);
            text-shadow: 0 0 0.6em rgba(255, 226, 122, 0.7);
            text-align: center;
            cursor: pointer;
        }
        .jukebox__select option { background: #131315; color: #e5e1e4; font-size: 1rem; text-shadow: none; }
        .jukebox__note {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: calc(var(--jb) * 0.12);
            fill: var(--c);
            filter: drop-shadow(0 0 calc(var(--jb) * 0.02) var(--c));
            opacity: 0;
            animation: jukebox-note 7s ease-in-out var(--d) infinite;
            pointer-events: none;
        }
        @keyframes jukebox-note {
            0% { opacity: 0; transform: translateY(30%) rotate(-10deg); }
            20%, 65% { opacity: 0.9; }
            100% { opacity: 0; transform: translateY(-90%) rotate(10deg); }
        }
        /* Lever: --pull 0 is up, 1 is fully down. The rod swings toward the
           viewer around the hub, 150deg at full pull (LEVER_SWING_DEG in
           lever.js): seen from the front it shortens and flips, and the knob
           grows as it comes closer. */
        @property --pull { syntax: '<number>'; inherits: true; initial-value: 0; }
        .lever {
            --rod: calc(var(--jb) * 0.4);
            --knob: calc(var(--jb) * 0.15);
            --swing: calc(var(--pull) * 150deg);
            position: absolute;
            top: 55.882%;
            left: 100%;
            width: calc(var(--knob) + var(--jb) * 0.06);
            height: calc(var(--rod) * 2 + var(--knob) * 1.4);
            translate: calc(var(--jb) * -0.015) -50%;
            touch-action: none;
            cursor: grab;
            -webkit-tap-highlight-color: transparent;
            transition: --pull 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .lever:disabled { cursor: default; }
        .lever--dragging { transition: none; cursor: grabbing; }
        .lever--pulling { transition: none; animation: lever-pull 0.9s both; }
        @keyframes lever-pull {
            0% { --pull: var(--pull-from, 0); animation-timing-function: cubic-bezier(0.55, 0, 0.9, 0.45); }
            30% { --pull: 1; animation-timing-function: cubic-bezier(0.3, 1.45, 0.6, 1); }
            100% { --pull: 0; }
        }
        @media (hover: hover) {
            .lever:not(:disabled):hover { --pull: 0.06; }
        }
        .lever__mount {
            position: absolute;
            left: calc(var(--jb) * -0.02);
            top: 50%;
            width: calc(50% + var(--jb) * 0.02);
            height: calc(var(--jb) * 0.08);
            translate: 0 -50%;
            border-radius: 0 calc(var(--jb) * 0.025) calc(var(--jb) * 0.025) 0;
            background: linear-gradient(180deg, #eef8fd, #9fb6c3 50%, #5b7282);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 1px 3px rgba(0, 0, 0, 0.5);
        }
        .lever__rod {
            position: absolute;
            left: 50%;
            bottom: 50%;
            width: calc(var(--jb) * 0.022);
            height: var(--rod);
            translate: -50% 0;
            transform-origin: 50% 100%;
            transform: scaleY(cos(var(--swing)));
            border-radius: calc(var(--jb) * 0.011);
            background: linear-gradient(90deg, #5f5c6a, #f4f1fa 40%, #a29dae 70%, #55525f);
        }
        .lever__hub {
            position: absolute;
            left: 50%;
            top: 50%;
            width: calc(var(--jb) * 0.08);
            height: calc(var(--jb) * 0.08);
            translate: -50% -50%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, #bdb8ca 30%, #56535f 75%, #29272f);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45), 0 0 10px rgba(208, 188, 255, 0.35);
        }
        .lever__knob {
            position: absolute;
            left: 50%;
            top: calc(50% - var(--rod));
            width: var(--knob);
            height: var(--knob);
            translate: -50% -50%;
            transform: translateY(calc(var(--rod) * (1 - cos(var(--swing))))) scale(calc(1 + 0.35 * sin(var(--swing))));
            border-radius: 50%;
            background: radial-gradient(circle at 34% 30%, #fff 0 7%, #ffd9e4 14%, #f751a1 50%, #8c0053 100%);
            box-shadow: 0 0 calc(var(--knob) * 0.4) rgba(247, 81, 161, 0.75), 0 0 calc(var(--knob) * 0.9) rgba(247, 81, 161, 0.35);
        }
        .lever:focus-visible { outline: none; }
        .lever:focus-visible .lever__knob { outline: 2px solid #4cd7f6; outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) {
            .genre-drum { transition-duration: 0ms !important; }
            .genre-drum--landed .genre-drum__lens, .genre-drum--idle, .jukebox__label, .lever--pulling { animation: none; }
            .jukebox__note { animation: none; opacity: 0.6; }
            .lever { transition: none; }
        }
        /* Turntable. turntable.js sets --disc-angle (label rotation), --arm
           (0 on the rest, 1 on the record), --lift (0 lowered, 1 raised) and
           --contact (1 while the needle sits in the groove). #turntable takes
           the height left between the headline and the controls; the record
           fills it together with the analyser ring (1.5x the record). */
        @property --deck { syntax: '<length>'; inherits: true; initial-value: 0px; }
        .turntable {
            --deck-min: clamp(9rem, 27vh, 17rem);
            flex: 1 1 0;
            align-self: stretch;
            min-height: calc(var(--deck-min) * 1.5);
            container-type: size;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .turntable__deck {
            --deck: calc(min(100cqh, 100cqw) / 1.5);
            position: relative;
            flex: none;
            width: var(--deck);
            height: var(--deck);
        }
        /* 1.5x the record: waveform.js draws its ring from the record edge out. */
        .turntable__ring { position: absolute; left: -25%; top: -25%; width: 150%; height: 150%; pointer-events: none; }
        .turntable__record { position: absolute; inset: 0; border-radius: 50%; }
        .turntable__vinyl {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle closest-side, transparent 60%, rgba(0, 0, 0, 0.6) 60.5% 61.5%, transparent 62% 79%, rgba(0, 0, 0, 0.6) 79.5% 80.5%, transparent 81%),
                repeating-radial-gradient(circle closest-side, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 3px),
                radial-gradient(circle closest-side, #1e1d25 0%, #111116 70%, #09090c 100%);
            box-shadow:
                0 0 0 1px rgba(208, 188, 255, calc(0.18 + 0.3 * var(--contact, 0))),
                0 0 calc(var(--deck) * (0.1 + 0.16 * var(--contact, 0))) rgba(208, 188, 255, calc(0.12 + 0.3 * var(--contact, 0))),
                inset 0 0 0 3px rgba(0, 0, 0, 0.6);
        }
        .turntable__label { position: absolute; inset: 0; transform: rotate(var(--disc-angle, 0deg)); }
        /* Light reflects off a fixed spot while the record turns under it. */
        .turntable__sheen {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 20deg, transparent 0deg, rgba(255, 255, 255, 0.08) 28deg, transparent 56deg 180deg, rgba(255, 255, 255, 0.06) 208deg, transparent 236deg);
            -webkit-mask-image: radial-gradient(circle closest-side, transparent 35%, #000 36%);
            mask-image: radial-gradient(circle closest-side, transparent 35%, #000 36%);
            pointer-events: none;
        }
        /* The groove under the needle lights up while it plays. */
        .turntable__groove {
            position: absolute;
            inset: 7%;
            border-radius: 50%;
            border: 1px solid rgba(76, 215, 246, 0.7);
            box-shadow: 0 0 calc(var(--deck) * 0.06) rgba(76, 215, 246, 0.55), inset 0 0 calc(var(--deck) * 0.06) rgba(76, 215, 246, 0.35);
            opacity: calc(var(--contact, 0) * 0.6);
        }
        .turntable__arm {
            position: absolute;
            left: 0;
            top: -10%;
            width: 136%;
            height: 120%;
            overflow: visible;
            pointer-events: none;
            filter: drop-shadow(calc(var(--deck) * (0.008 + 0.025 * var(--lift, 0))) calc(var(--deck) * (0.012 + 0.037 * var(--lift, 0))) calc(var(--deck) * (0.012 + 0.025 * var(--lift, 0))) rgba(0, 0, 0, 0.6));
        }
        /* Rest at 6.6deg, on the record at 21.1deg: the stylus lands on the
           groove at 43% of the record radius. */
        .turntable__tonearm {
            transform-box: view-box;
            transform-origin: 114px 14px;
            transform: rotate(calc(6.6deg + var(--arm, 0) * 14.5deg)) scale(calc(1 + var(--lift, 0) * 0.025));
        }
        .turntable__contact { opacity: var(--contact, 0); }
        .glow-primary-soft { box-shadow: 0 0 30px rgba(208, 188, 255, 0.4); }
        .glow-secondary-soft { box-shadow: 0 0 20px rgba(76, 215, 246, 0.4); }
        .glass-card {
            background: rgba(10, 10, 12, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(208, 188, 255, 0.15);
        }
        .inner-glow-border {
            border: 1px solid transparent;
            background-image: linear-gradient(rgba(19, 19, 21, 1), rgba(19, 19, 21, 1)), radial-gradient(circle at top left, rgba(208, 188, 255, 0.3), rgba(208, 188, 255, 0.05));
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }
        .glow-track-fill {
            box-shadow: 0 0 15px rgba(76, 215, 246, 0.6);
        }
        .film-grain::after {
            content: "";
            position: fixed;
            top: -100%;
            left: -100%;
            right: -100%;
            bottom: -100%;
            background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
            opacity: 0.03;
            pointer-events: none;
            z-index: 50;
        }

        /* Jukebox control deck: chunky keys in chrome bezels and an amber
           display with the clip clock. --key is the key size; it follows the
           screen height. */
        .jb-deck {
            --key: clamp(3rem, 7vh, 6rem);
            position: relative;
            display: flex;
            align-items: center;
            gap: calc(var(--key) * 0.3);
            width: 100%;
            max-width: max(42rem, var(--key) * 11);
            padding: calc(var(--key) * 0.22) calc(var(--key) * 0.28);
            border: calc(var(--key) * 0.07) solid transparent;
            border-radius: calc(var(--key) * 0.36);
            background:
                linear-gradient(180deg, #5b2234, #3d1424 55%, #260b16) padding-box,
                linear-gradient(180deg, #eef8fd, #9fb6c3 45%, #5b7282) border-box;
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.5),
                -12px 0 40px -10px rgba(247, 81, 161, 0.4),
                12px 0 40px -10px rgba(76, 215, 246, 0.4),
                inset 0 calc(var(--key) * 0.04) calc(var(--key) * 0.15) rgba(0, 0, 0, 0.6);
        }
        /* A phone fits three keys and the clock at the 44px tap minimum. */
        @media (max-width: 639px) { .jb-deck { --key: 2.75rem; } }
        @media (max-width: 359px) {
            .jb-deck { gap: calc(var(--key) * 0.15); padding-inline: calc(var(--key) * 0.18); }
            .jb-deck .jb-display { padding: 0 calc(var(--key) * 0.12); }
        }
        /* Neon tube along the top of the deck. */
        .jb-deck::before {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            top: calc(var(--key) * 0.07);
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, #4cd7f6, #f751a1, #7ef29d);
            box-shadow: 0 0 8px rgba(247, 81, 161, 0.7);
        }
        .jb-key {
            --cap: #f751a1;
            --cap-hi: #ffd9e4;
            --cap-lo: #8c0053;
            position: relative;
            flex: none;
            display: grid;
            place-items: center;
            width: var(--key);
            height: var(--key);
            border-radius: calc(var(--key) * 0.24);
            background: linear-gradient(180deg, #eef8fd, #9fb6c3 50%, #5b7282);
            box-shadow:
                0 calc(var(--key) * 0.08) 0 #2a3640,
                0 calc(var(--key) * 0.12) calc(var(--key) * 0.2) rgba(0, 0, 0, 0.6);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .jb-key--amber { --cap: #ffc93c; --cap-hi: #fff3c4; --cap-lo: #9a6400; }
        .jb-key--cyan { --cap: #4cd7f6; --cap-hi: #d2f7ff; --cap-lo: #00616f; }
        /* A key with words on it; narrow screens show only its icon. */
        .jb-key--wide {
            width: auto;
            grid-auto-flow: column;
            gap: calc(var(--key) * 0.12);
            padding: 0 calc(var(--key) * 0.32);
        }
        .jb-key__text {
            position: relative;
            font-family: "Sora", system-ui, sans-serif;
            font-weight: 800;
            font-size: calc(var(--key) * 0.26);
            letter-spacing: 0.02em;
            color: rgba(0, 31, 38, 0.9);
            white-space: nowrap;
        }
        /* The glowing cap inside the chrome bezel. */
        .jb-key::before {
            content: "";
            position: absolute;
            inset: calc(var(--key) * 0.09);
            border-radius: calc(var(--key) * 0.17);
            background: radial-gradient(circle at 35% 25%, #fff 0 6%, var(--cap-hi) 16%, var(--cap) 58%, var(--cap-lo));
            box-shadow:
                0 0 calc(var(--key) * 0.3) color-mix(in srgb, var(--cap) 60%, transparent),
                inset 0 calc(var(--key) * -0.04) calc(var(--key) * 0.08) rgba(0, 0, 0, 0.3);
        }
        .jb-key .material-symbols-outlined {
            position: relative;
            font-size: calc(var(--key) * 0.5);
            color: rgba(35, 0, 22, 0.85);
            font-variation-settings: 'FILL' 1;
        }
        .jb-key:active {

<svg class="jukebox__note" style="--x: 104%; --y: 0%; --c: #4cd7f6; --d: 2.3s" viewBox="0 0 30 32" aria-hidden="true"><ellipse cx="6.5" cy="26" rx="5" ry="3.6" transform="rotate(-20 6.5 26)"/><ellipse cx="22.5" cy="22" rx="5" ry="3.6" transform="rotate(-20 22.5 22)"/><rect x="10" y="6" width="2" height="20"/><rect x="26" y="2" width="2" height="20"/><path d="M10 6 28 1.5V6L10 10.5z"/></svg>
<svg class="jukebox__note" style="--x: -18%; --y: 55.9%; --c: #ffe27a; --d: 4.6s" viewBox="0 0 24 32" aria-hidden="true"><ellipse cx="8.5" cy="25" rx="5.2" ry="3.8" transform="rotate(-20 8.5 25)"/><rect x="12" y="4" width="2" height="21"/><path d="M14 4c0 5 7 5 6.5 13-1-4.5-3.5-6-6.5-6z"/></svg>
<button id="spin-btn" type="button" aria-label="Spin" class="lever">
<span class="lever__mount"></span>
<span class="lever__rod"></span>
<span class="lever__hub"></span>
<span class="lever__knob"></span>
</button>
<h3 id="jukebox-genre" class="sr-only" aria-live="polite"></h3>
</div>
</div>
<!-- Playback controls as a jukebox deck (visible during spinning/playing/revealed). -->
<div id="phase-controls" hidden class="jb-deck">
<audio id="audio" preload="auto" crossorigin="anonymous"></audio>
<button id="replay-btn" type="button" aria-label="Replay" hidden class="jb-key jb-key--amber">
<span class="material-symbols-outlined">replay</span>
</button>
<button id="play-btn" type="button" aria-label="Play" hidden class="jb-key">
<span class="material-symbols-outlined">play_arrow</span>
</button>
<!-- Shown once the clip ends or is paused. NEXT lives inside the reveal
     overlay so it sits above the z-60 layer and stays clickable. -->
<button id="reveal-btn" type="button" aria-label="Reveal track" hidden class="jb-key jb-key--cyan jb-key--wide">
<span class="material-symbols-outlined">visibility</span>
<span class="jb-key__text hidden sm:inline">REVEAL TRACK</span>
</button>
<div class="jb-display">
<span id="time-readout" class="jb-display__time num">0:00 / 0:30</span>
<input id="scrubber" type="range" min="0" max="30" step="0.1" value="0" aria-label="Playback position, drag to seek" disabled>
</div>
</div>
<!-- REVEAL STATE -->
<div id="reveal-card" hidden class="fixed inset-0 z-[60] bg-background/95 backdrop-blur-2xl flex flex-col items-center justify-center transition-opacity duration-700">
<div class="absolute inset-0 bg-gradient-to-b from-primary/10 to-transparent"></div>
<div class="relative text-center px-margin-mobile md:px-margin-desktop flex flex-col items-center">
<span class="font-label-caps text-label-caps text-secondary tracking-[0.5em] mb-8 block">REVEALED ARTIST</span>
<h3 class="reveal-card__artist font-display-lg text-5xl sm:text-6xl md:text-display-lg text-on-surface mb-4 leading-none tracking-tight break-words"></h3>
<h4 class="reveal-card__title font-headline-lg text-4xl md:text-5xl text-primary-fixed-dim italic break-words"></h4>
<p class="reveal-card__year num font-label-mono text-4xl md:text-5xl text-on-surface-variant mt-6"></p>
<button id="next-btn" type="button" hidden class="mt-12 px-12 py-4 rounded-xl bg-secondary text-on-secondary font-headline-lg text-headline-lg-mobile hover:scale-[1.05] active:scale-95 transition-all glow-secondary-soft">
                NEXT SONG
            </button>
</div>
</div>
</main>
<!-- Scoreboard Footer (display-ui replaces children from state.teams) -->
<footer class="fixed bottom-0 w-full bg-surface-container-lowest/50 backdrop-blur-3xl border-t border-outline-variant/10 px-margin-mobile md:px-margin-desktop py-4 md:py-10 z-40 max-h-[40vh] overflow-y-auto">
<ul id="scoreboard-list" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-gutter max-w-screen-2xl mx-auto h-full items-end list-none p-0 m-0">
<!-- Stitch sample team cards (template; display-ui replaces from real state) -->
<li class="space-y-4">
<div class="flex justify-between items-end">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
<span class="font-label-mono text-label-mono text-on-surface uppercase tracking-wider">NEON RIDERS</span>
</div>
<span class="font-headline-lg text-headline-lg text-secondary">2,450</span>
</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary glow-track-fill rounded-full" style="width: 75%"></div>
</div>
</li>
</ul>
</footer>
<!-- Teams panel (toggleable via #teams-toggle-btn). Holds add/remove/rename UI. -->
<div id="teams-panel" hidden class="fixed top-20 md:top-24 right-margin-mobile md:right-margin-desktop z-[55] w-80 max-w-[calc(100vw-2rem)] glass-card rounded-xl p-6 space-y-4 shadow-2xl">
<div class="flex items-center justify-between">
<h3 class="font-label-caps text-label-caps text-on-surface-variant tracking-widest">TEAMS</h3>
<button id="teams-panel-close-btn" type="button" aria-label="Close" class="material-symbols-outlined text-on-surface-variant hover:text-primary">close</button>
</div>
<ul id="teams-list" class="grid grid-cols-1 gap-2 list-none p-0 m-0"></ul>
<form id="add-team-form" class="flex gap-2">
<input id="add-team-input" type="text" required maxlength="40" placeholder="Team name" autocomplete="off" aria-label="Team name"
  class="flex-1 bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50">
<button type="submit"
  class="px-4 py-2 rounded-lg bg-primary text-on-primary font-label-caps text-label-caps hover:scale-105 active:scale-95 transition-all">
  + Team
</button>
</form>
<!-- Award area is mirrored into the scoreboard cards by display-ui;
     this is the JS contract container kept hidden offscreen. -->
<div id="award-area" hidden>
<ul id="award-teams" class="list-none p-0 m-0"></ul>
</div>
</div>
<!-- Shown while the browser blocks audible playback; the whole overlay is the tap target. -->
<div id="sound-gate" class="sound-gate" hidden>
  <div class="sound-gate__pill">
    <span class="material-symbols-outlined">volume_off</span>
    <span id="sound-gate-message">Tap anywhere for sound</span>
  </div>
</div>
<script type="module" src="/static/js/main-display.js"></script>
</body></html>
