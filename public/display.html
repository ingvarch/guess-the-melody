<style>
        /* The HTML `hidden` attribute must always win over Tailwind display
           utilities (.flex/.grid/etc share equal specificity and the CDN sheet
           loads later, so without this an element with `flex hidden` stays visible). */
        [hidden] { display: none !important; }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 6s linear infinite; }
        /* Reveal slide-in: replays every time #reveal-card loses [hidden]. */
        @keyframes reveal-in {
            0%   { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes reveal-line {
            0%   { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        #reveal-card:not([hidden]) { animation: reveal-in 0.6s cubic-bezier(0.16,1,0.3,1) both; }
        #reveal-card:not([hidden]) .reveal-card__artist { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.15s both; }
        #reveal-card:not([hidden]) .reveal-card__title  { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.30s both; }
        #reveal-card:not([hidden]) .reveal-card__year   { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.45s both; }
        #reveal-card:not([hidden]) #next-btn            { animation: reveal-line 0.6s cubic-bezier(0.16,1,0.3,1) 0.65s both; }
        /* Headline cross-fade while the genre slot-machine cycles. */
        #display-genre { transition: opacity 0.12s ease; }
        /* Genre drum: a 3D cylinder of genre names. runSpin sets --step, --r and
           --line for the row count and transitions --spin to the picked row.
           Two copies of the cylinder: dim rows above and below, and a bright
           "lens" clipped to the center band. */
        @property --spin { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
        #spin-card:not([hidden]) .genre-drum { animation: reveal-in 0.4s cubic-bezier(0.16,1,0.3,1) both; }
        .genre-drum {
            position: relative;
            height: calc(var(--line, 1.2em) * 5);
            font-size: clamp(2.25rem, 7vw, 5rem);
            line-height: var(--line, 1.2em);
            overflow: hidden;
            transition-property: --spin;
            transition-timing-function: cubic-bezier(0.25, 0.6, 0.3, 1);
        }
        .genre-drum__stage { position: absolute; inset: 0; perspective: calc(var(--r) * 6); }
        .genre-drum__dim {
            color: rgba(203, 195, 215, 0.4);
            --window: linear-gradient(to bottom,
                transparent 0,
                #000 calc(50% - 2.2em),
                #000 calc(50% - 1.5em),
                transparent calc(50% - 0.5em),
                transparent calc(50% + 0.5em),
                #000 calc(50% + 1.5em),
                #000 calc(50% + 2.2em),
                transparent 100%);
            -webkit-mask-image: var(--window);
            mask-image: var(--window);
        }
        .genre-drum__lens { clip-path: inset(calc(50% - var(--line) / 2) 0); }
        .genre-drum__cylinder {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            transform: translateZ(calc(-1 * var(--r))) rotateX(var(--spin));
        }
        .genre-drum__row {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            margin-top: calc(var(--line) / -2);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backface-visibility: hidden;
            transform: rotateX(calc(-1 * var(--i) * var(--step))) translateZ(var(--r));
        }
        .genre-drum--landed .genre-drum__lens { animation: drum-land 0.5s cubic-bezier(0.16,1,0.3,1) both; }
        .genre-drum--landed .genre-drum__lens .genre-drum__row {
            background: linear-gradient(90deg, #d0bcff, #4cd7f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @keyframes drum-land { from { transform: scale(1.08); } to { transform: scale(1); } }
        @media (prefers-reduced-motion: reduce) {
            .genre-drum { transition-duration: 0ms !important; }
            #spin-card:not([hidden]) .genre-drum, .genre-drum--landed .genre-drum__lens { animation: none; }
        }
        /* Turntable. turntable.js sets --disc-angle (label rotation), --arm
           (0 on the rest, 1 on the record), --lift (0 lowered, 1 raised) and
           --contact (1 while the needle sits in the groove). */
        .turntable {
            --deck: clamp(9rem, 27vh, 17rem);
            position: relative;
            width: var(--deck);
            height: var(--deck);
            /* Room for the analyser ring, which reaches ~22% of the record past its edge. */
            margin-top: calc(var(--deck) * 0.25);
        }
        @media (min-width: 640px) { .turntable { margin-top: calc(var(--deck) * 0.1); } }
        /* 1.5x the record: waveform.js draws its ring from the record edge out. */
        .turntable__ring { position: absolute; left: -25%; top: -25%; width: 150%; height: 150%; pointer-events: none; }
        .turntable__record { position: absolute; inset: 0; border-radius: 50%; }
        .turntable__vinyl {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle closest-side, transparent 60%, rgba(0, 0, 0, 0.6) 60.5% 61.5%, transparent 62% 79%, rgba(0, 0, 0, 0.6) 79.5% 80.5%, transparent 81%),
                repeating-radial-gradient(circle closest-side, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 3px),
                radial-gradient(circle closest-side, #1e1d25 0%, #111116 70%, #09090c 100%);
            box-shadow:
                0 0 0 1px rgba(208, 188, 255, calc(0.18 + 0.3 * var(--contact, 0))),
                0 0 calc(24px + 40px * var(--contact, 0)) rgba(208, 188, 255, calc(0.12 + 0.3 * var(--contact, 0))),
                inset 0 0 0 3px rgba(0, 0, 0, 0.6);
        }
        .turntable__label { position: absolute; inset: 0; transform: rotate(var(--disc-angle, 0deg)); }
        /* Light reflects off a fixed spot while the record turns under it. */
        .turntable__sheen {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 20deg, transparent 0deg, rgba(255, 255, 255, 0.08) 28deg, transparent 56deg 180deg, rgba(255, 255, 255, 0.06) 208deg, transparent 236deg);
            -webkit-mask-image: radial-gradient(circle closest-side, transparent 35%, #000 36%);
            mask-image: radial-gradient(circle closest-side, transparent 35%, #000 36%);
            pointer-events: none;
        }
        /* The groove under the needle lights up while it plays. */
        .turntable__groove {
            position: absolute;
            inset: 7%;
            border-radius: 50%;
            border: 1px solid rgba(76, 215, 246, 0.7);
            box-shadow: 0 0 14px rgba(76, 215, 246, 0.55), inset 0 0 14px rgba(76, 215, 246, 0.35);
            opacity: calc(var(--contact, 0) * 0.6);
        }
        .turntable__arm {
            position: absolute;
            left: 0;
            top: -10%;
            width: 136%;
            height: 120%;
            overflow: visible;
            pointer-events: none;
            filter: drop-shadow(calc(2px + 6px * var(--lift, 0)) calc(3px + 9px * var(--lift, 0)) calc(3px + 6px * var(--lift, 0)) rgba(0, 0, 0, 0.6));
        }
        /* Rest at 6.6deg, on the record at 21.1deg: the stylus lands on the
           groove at 43% of the record radius. */
        .turntable__tonearm {
            transform-box: view-box;
            transform-origin: 114px 14px;
            transform: rotate(calc(6.6deg + var(--arm, 0) * 14.5deg)) scale(calc(1 + var(--lift, 0) * 0.025));
        }
        .turntable__contact { opacity: var(--contact, 0); }
        .glow-primary-soft { box-shadow: 0 0 30px rgba(208, 188, 255, 0.4); }
        .glow-secondary-soft { box-shadow: 0 0 20px rgba(76, 215, 246, 0.4); }
        .glass-card {
            background: rgba(10, 10, 12, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(208, 188, 255, 0.15);
        }
        .inner-glow-border {
            border: 1px solid transparent;
            background-image: linear-gradient(rgba(19, 19, 21, 1), rgba(19, 19, 21, 1)), radial-gradient(circle at top left, rgba(208, 188, 255, 0.3), rgba(208, 188, 255, 0.05));
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }
        .glow-track-fill {
            box-shadow: 0 0 15px rgba(76, 215, 246, 0.6);
        }
        .film-grain::after {
            content: "";
            position: fixed;
            top: -100%;
            left: -100%;
            right: -100%;
            bottom: -100%;
            background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
            opacity: 0.03;
            pointer-events: none;
            z-index: 50;
        }

        /* Seek bar. Interactive during the playing phase: drag to any moment.
           Thumb is finger-sized on touch, restrained on the projector.
           touch-action keeps a drag from being stolen by page scrolling. */
        #scrubber {
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            outline: none;
            cursor: pointer;
            touch-action: none;
        }
        #scrubber:disabled { cursor: default; opacity: 0.45; }
        #scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #4cd7f6;
            border: 3px solid rgba(10, 12, 18, 0.9);
            box-shadow: 0 0 12px rgba(76, 215, 246, 0.55);
            transition: transform 0.15s ease;
        }
        #scrubber::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #4cd7f6;
            border: 3px solid rgba(10, 12, 18, 0.9);
            box-shadow: 0 0 12px rgba(76, 215, 246, 0.55);
        }
        #scrubber:disabled::-webkit-slider-thumb { box-shadow: none; background: rgba(255, 255, 255, 0.35); }
        #scrubber:disabled::-moz-range-thumb { box-shadow: none; background: rgba(255, 255, 255, 0.35); }
        @media (hover: hover) {
            #scrubber:not(:disabled):hover::-webkit-slider-thumb { transform: scale(1.15); }
        }

        /* Full-screen tap target while the browser blocks audible playback. */
        .sound-gate {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6vh;
            background: rgba(0, 0, 0, 0.35);
            cursor: pointer;
        }
        .sound-gate__pill {
            display: flex;
            align-items: center;
            gap: 0.6em;
            padding: 0.8em 1.6em;
            border-radius: 999px;
            background: rgba(20, 20, 28, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: clamp(1.1rem, 2.2vw, 1.6rem);
            animation: sound-gate-pulse 2s ease-in-out infinite;
        }
        @keyframes sound-gate-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        @media (prefers-reduced-motion: reduce) {
            .sound-gate__pill { animation: none; }
        }
    </style>

<!-- Idle controls: SPIN + genre selector. Visible when phase === 'idle'. -->
<div id="idle-controls" hidden class="flex flex-col items-center gap-8 w-full max-w-2xl">
<select id="genre-select" aria-label="Genre"
  class="w-full max-w-xs text-center bg-surface-container-low border border-outline-variant rounded-full px-5 py-3 font-label-mono text-label-mono text-on-surface cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary/50 disabled:opacity-50 disabled:cursor-not-allowed"></select>
<button id="spin-btn" type="button" aria-label="Spin" class="relative w-48 h-48 md:w-64 md:h-64 rounded-full bg-background border-4 border-primary inner-glow-border flex items-center justify-center active:scale-95 transition-all duration-200 glow-primary-soft disabled:opacity-50 disabled:cursor-not-allowed">
<span class="material-symbols-outlined text-6xl md:text-8xl text-primary animate-spin-slow">autorenew</span>
</button>
</div>
<!-- Playback Controls (visible during spinning/playing/revealed) -->
<div id="phase-controls" hidden class="glass-card rounded-xl p-4 sm:p-6 flex flex-wrap items-center justify-between gap-4 sm:gap-6 w-full max-w-2xl">
<audio id="audio" preload="auto" crossorigin="anonymous"></audio>
<div class="flex items-center gap-4">
<button id="replay-btn" type="button" aria-label="Replay" hidden class="w-11 h-11 sm:w-12 sm:h-12 rounded-full flex items-center justify-center border border-outline-variant text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">replay</span>
</button>
<button id="play-btn" type="button" aria-label="Play" hidden class="w-12 h-12 sm:w-16 sm:h-16 rounded-full flex items-center justify-center bg-secondary text-on-secondary hover:glow-secondary-soft transition-all">
<span class="material-symbols-outlined text-3xl sm:text-4xl" data-weight="fill">play_arrow</span>
</button>
</div>
<div class="flex-1 max-w-md">
<div class="flex justify-between font-label-mono text-[10px] text-on-surface-variant mb-2">
<span id="time-readout" class="num">0:00 / 0:30</span>
</div>
<input id="scrubber" type="range" min="0" max="30" step="0.1" value="0" aria-label="Playback position, drag to seek" disabled class="w-full">
</div>
</div>
<!-- Reveal button (shown when the clip ends). NEXT lives inside the reveal
     overlay below so it sits above the z-60 layer and stays clickable. -->
<div class="mt-6 flex flex-col items-center gap-4 w-full max-w-2xl">
<button id="reveal-btn" type="button" hidden class="w-full max-w-md py-4 rounded-xl bg-primary text-on-primary font-headline-lg text-headline-lg-mobile md:text-headline-lg hover:scale-[1.02] active:scale-95 transition-all glow-primary-soft">
                REVEAL TRACK
            </button>
</div>
<!-- SPIN STATE: the genre drum on a dimmed backdrop. runSpin shows it while
     picking, spins it to the chosen genre, holds 3s, then closes to the Play screen. -->
<div id="spin-card" hidden class="fixed inset-0 z-[60] flex items-center justify-center p-margin-mobile">
<div class="absolute inset-0 bg-background/95 backdrop-blur-2xl"></div>
<div class="relative z-10 w-full max-w-5xl flex flex-col items-center">
<span class="font-label-caps text-label-caps text-secondary tracking-[0.5em] mb-6 block">PICKING GENRE</span>
<div id="genre-drum" class="genre-drum w-full font-display-lg font-extrabold uppercase tracking-tight" aria-hidden="true">
<div class="genre-drum__stage genre-drum__dim"><div class="genre-drum__cylinder" data-drum-cylinder></div></div>
<div class="genre-drum__stage genre-drum__lens text-on-surface"><div class="genre-drum__cylinder" data-drum-cylinder></div></div>
</div>
<h3 id="spin-card-genre" class="sr-only" aria-live="polite"></h3>
</div>
</div>
<!-- REVEAL STATE -->
<div id="reveal-card" hidden class="fixed inset-0 z-[60] bg-background/95 backdrop-blur-2xl flex flex-col items-center justify-center transition-opacity duration-700">
<div class="absolute inset-0 bg-gradient-to-b from-primary/10 to-transparent"></div>
<div class="relative text-center px-margin-mobile md:px-margin-desktop flex flex-col items-center">
<span class="font-label-caps text-label-caps text-secondary tracking-[0.5em] mb-8 block">REVEALED ARTIST</span>
<h3 class="reveal-card__artist font-display-lg text-5xl sm:text-6xl md:text-display-lg text-on-surface mb-4 leading-none tracking-tight break-words"></h3>
<h4 class="reveal-card__title font-headline-lg text-4xl md:text-5xl text-primary-fixed-dim italic break-words"></h4>
<p class="reveal-card__year num font-label-mono text-4xl md:text-5xl text-on-surface-variant mt-6"></p>
<button id="next-btn" type="button" hidden class="mt-12 px-12 py-4 rounded-xl bg-secondary text-on-secondary font-headline-lg text-headline-lg-mobile hover:scale-[1.05] active:scale-95 transition-all glow-secondary-soft">
                NEXT SONG
            </button>
</div>
</div>
</main>
<!-- Scoreboard Footer (display-ui replaces children from state.teams) -->
<footer class="fixed bottom-0 w-full bg-surface-container-lowest/50 backdrop-blur-3xl border-t border-outline-variant/10 px-margin-mobile md:px-margin-desktop py-4 md:py-10 z-40 max-h-[40vh] overflow-y-auto">
<ul id="scoreboard-list" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-gutter max-w-screen-2xl mx-auto h-full items-end list-none p-0 m-0">
<!-- Stitch sample team cards (template; display-ui replaces from real state) -->
<li class="space-y-4">
<div class="flex justify-between items-end">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
<span class="font-label-mono text-label-mono text-on-surface uppercase tracking-wider">NEON RIDERS</span>
</div>
<span class="font-headline-lg text-headline-lg text-secondary">2,450</span>
</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary glow-track-fill rounded-full" style="width: 75%"></div>
</div>
</li>
</ul>
</footer>
<!-- Teams panel (toggleable via #teams-toggle-btn). Holds add/remove/rename UI. -->
<div id="teams-panel" hidden class="fixed top-20 md:top-24 right-margin-mobile md:right-margin-desktop z-[55] w-80 max-w-[calc(100vw-2rem)] glass-card rounded-xl p-6 space-y-4 shadow-2xl">
<div class="flex items-center justify-between">
<h3 class="font-label-caps text-label-caps text-on-surface-variant tracking-widest">TEAMS</h3>
<button id="teams-panel-close-btn" type="button" aria-label="Close" class="material-symbols-outlined text-on-surface-variant hover:text-primary">close</button>
</div>
<ul id="teams-list" class="grid grid-cols-1 gap-2 list-none p-0 m-0"></ul>
<form id="add-team-form" class="flex gap-2">
<input id="add-team-input" type="text" required maxlength="40" placeholder="Team name" autocomplete="off" aria-label="Team name"
  class="flex-1 bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50">
<button type="submit"
  class="px-4 py-2 rounded-lg bg-primary text-on-primary font-label-caps text-label-caps hover:scale-105 active:scale-95 transition-all">
  + Team
</button>
</form>
<!-- Award area is mirrored into the scoreboard cards by display-ui;
     this is the JS contract container kept hidden offscreen. -->
<div id="award-area" hidden>
<ul id="award-teams" class="list-none p-0 m-0"></ul>
</div>
</div>
<!-- Shown while the browser blocks audible playback; the whole overlay is the tap target. -->
<div id="sound-gate" class="sound-gate" hidden>
  <div class="sound-gate__pill">
    <span class="material-symbols-outlined">volume_off</span>
    <span id="sound-gate-message">Tap anywhere for sound</span>
  </div>
</div>
<script type="module" src="/static/js/main-display.js"></script>
</body></html>
