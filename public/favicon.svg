<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1628"/>
      <stop offset="100%" stop-color="#0c0a13"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff65a0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="45%" stop-color="#b69df8"/>
      <stop offset="100%" stop-color="#ff5fa0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="14" y="14" width="228" height="228" rx="52" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Note shape with glow -->
  <g fill="url(#noteGrad)" filter="url(#glow)">
    <!-- Left note head -->
    <ellipse cx="92" cy="178" rx="26" ry="18" transform="rotate(-22 92 178)"/>
    <!-- Right note head -->
    <ellipse cx="174" cy="150" rx="26" ry="18" transform="rotate(-22 174 150)"/>
    <!-- Left stem -->
    <rect x="101" y="76" width="15" height="102"/>
    <!-- Right stem -->
    <rect x="183" y="50" width="15" height="100"/>
    <!-- Beam -->
    <polygon points="101,76 198,50 198,74 101,100"/>
  </g>
</svg>
